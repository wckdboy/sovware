name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-29
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: check
        run: ./scripts/check.sh

      - name: install engineering scanners
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check semgrep==1.182.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1 # module path is legacy; binary is gitleaks
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: engineering verification
        run: ./.agents/bin/eng verify --profile full --ci

      - name: upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eng-evidence
          path: .agents/evidence/
          if-no-files-found: warn
          retention-days: 14
