[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/wckdboy/sovware"

[workspace.dependencies]
sov-core = { path = "crates/sov-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
